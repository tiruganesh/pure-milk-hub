```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureMilkHub - Fresh Milk & Pot Curd</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="nav-left">
            <img src="logo.jpg" class="logo" alt="PureMilkHub Logo">
        </div>

        <div class="nav-right">

            <a href="index.html" class="btn btn-success">Home</a>

            <a href="About.html" class="btn btn-warning text-dark">About</a>

            <a href="Contact.html" class="btn btn-primary">Contact</a>

        </div>

    </nav>

    <!-- Hero -->

    <section class="hero">

        <h1>🥛 Satya Ganga Dairy Milk</h1>

        <p>
            Fresh Milk & Fresh Pot Curd Delivered to Your Doorstep
        </p>

    </section>

    <!-- Milk Form -->

    <section class="container">

        <h2>Order Fresh Milk</h2>

        <form id="milkOrderForm">

            <label>Customer Name</label>

            <input
                type="text"
                id="milk-name"
                placeholder="Enter your name"
                required>

            <label>Quantity (Liters)</label>

            <input
                type="number"
                id="milk-quantity"
                min="1"
                placeholder="Enter quantity"
                required>

            <label>Delivery Address</label>

            <textarea
                id="milk-address"
                rows="4"
                placeholder="Enter delivery address"
                required></textarea>

            <button type="submit">
                Place Milk Order
            </button>

        </form>

        <p id="milk-message"></p>

    </section>

    <!-- Curd Form -->

    <section class="container">

        <h2>Order Fresh Pot Curd</h2>

        <form id="curdOrderForm">

            <label>Customer Name</label>

            <input
                type="text"
                id="curd-name"
                placeholder="Enter your name"
                required>

            <label>Quantity (Kg)</label>

            <input
                type="number"
                id="curd-quantity"
                min="1"
                placeholder="Enter quantity"
                required>

            <label>Delivery Address</label>

            <textarea
                id="curd-address"
                rows="4"
                placeholder="Enter delivery address"
                required></textarea>

            <button type="submit">
                Place Curd Order
            </button>

        </form>

        <p id="curd-message"></p>

    </section>

    <!-- Footer -->

    <footer>

        <h3>PureMilkHub</h3>

        <p>Fresh Milk | Fresh Pot Curd | Fast Home Delivery</p>

        <p>© 2026 PureMilkHub. All Rights Reserved.</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
```
